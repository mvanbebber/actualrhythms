# Static site: no build step, serve the repository root.
[build]
  publish = "."
  command = ""

# Rhythm data and VexFlow are large; let browsers cache them briefly and revalidate.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Piano samples never change.
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep the corpus build tooling out of the public site.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
